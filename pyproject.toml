[project]
name = "pt-proto"
version = "0.1.0"
description = "ConnectRPC vehicle monitoring protocol"
requires-python = ">=3.11"
dependencies = [
  "connectrpc>=0.11.1,<0.12",
  "googleapis-common-protos>=1.70.0",
  "protobuf>=6.30.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["examples/python", "gen/py"]
extraPaths = ["gen/py"]
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["gen/pyproto"]
namespaces = true

