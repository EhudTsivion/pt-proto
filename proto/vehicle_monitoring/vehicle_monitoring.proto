syntax = "proto3";

package vehicle_monitoring;

import "google/protobuf/timestamp.proto";
import "common/types.proto";

message VehicleMonitoringUpdate {
  optional string bearing = 1;
  optional int64 line_ref = 2;
  optional int64 operator_ref = 3;
  google.protobuf.Timestamp origin_aimed_departure_time = 4;
  optional int64 vehicle_ref = 5;
  optional int64 velocity = 6;
  google.protobuf.Timestamp recorded_at_time = 7;
  common.FramedVehicleJourneyRef framed_vehicle_journey_ref = 8;
  common.MonitoredCall monitored_call = 9;
  common.VehicleLocation vehicle_location = 10;
  google.protobuf.Timestamp response_timestamp = 11;
}

message VehicleMonitoringUpdatesBatch {
  repeated VehicleMonitoringUpdate updates = 1;
}

message SendVehicleMonitoringResponse {
  bool accepted = 1;
}

service VehicleMonitoringService {
  rpc Send(VehicleMonitoringUpdate) returns (SendVehicleMonitoringResponse);
  rpc SendBatch(VehicleMonitoringUpdatesBatch) returns (SendVehicleMonitoringResponse);
}