version: v2

clean: true

inputs:
  - directory: proto

plugins:
  - local: protoc-gen-es
    out: gen/tsproto
    include_imports: true
    opt:
      - target=ts 
  - local: protoc-gen-connect-es
    out: gen/tsproto
    opt:
      - target=ts
  - remote: buf.build/protocolbuffers/python
    out: gen/pyproto
    include_imports: true
  - remote: buf.build/protocolbuffers/pyi
    out: gen/pyproto
    include_imports: true
  - remote: buf.build/connectrpc/py
    out: gen/pyproto
    include_imports: true
    opt:
      - protobuf=google